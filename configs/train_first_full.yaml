tokenizer_path: tokenizer/tokenizer.json
seed: 42

batch_size: 8
gradient_accumulation_steps: 4

max_iters: 100000

eval_interval: 250
eval_iters: 50

learning_rate: 0.0003
min_lr: 0.00003
warmup_iters: 1000
lr_decay_iters: 100000

weight_decay: 0.1
betas: [0.9, 0.95]

grad_clip: 1.0

device: cuda
dtype: auto

model:
  vocab_size: 16000
  block_size: 1024

  n_layers: 12
  d_model: 320
  
  n_heads: 8
  n_kv_heads: 4
  
  ffn_mult: 4

  dropout: 0.0
  bias: false
  tie_embeddings: true
  attn_impl: naive