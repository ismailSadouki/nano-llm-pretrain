seed: 42

batch_size: 2
gradient_accumulation_steps: 2

max_iters: 5

eval_interval: 1
eval_iters: 2
learning_rate: 0.0003
min_lr: 0.00003
warmup_iters: 2
lr_decay_iters: 5

weight_decay: 0.1
betas: [0.9, 0.95]

grad_clip: 1.0

device: cuda
dtype: auto

model:
  vocab_size: 16000
  block_size: 1024

  n_layers: 2
  d_model: 64

  n_heads: 4
  n_kv_heads: 2

  ffn_mult: 4

  dropout: 0.0
  bias: false
  tie_embeddings: true
  attn_impl: naive